<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK FASHIONS - Member Login</title>
    <meta name="description" content="Sign in to your RK FASHIONS account to access exclusive luxury deals and member benefits.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="clean-login-body">

    <!-- CLEAN CENTERED LOGIN CONTAINER -->
    <main class="clean-login-section">
        <div class="clean-login-card">
            
            <!-- BRAND LOGO -->
            <div class="clean-login-brand">
                <h1>RK FASHIONS</h1>
                <span class="brand-tagline">LUXURY & STYLE • EST. 2026</span>
            </div>

            <!-- LOGIN / SIGN UP TABS -->
            <div class="login-tabs">
                <button class="tab-btn active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
                <button class="tab-btn" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
            </div>
            <p class="tab-subtext" id="tabSubtext">Sign in to your RK Fashions account to open Store Home with your 40% offer.</p>

            <!-- SIGN IN FORM -->
            <form id="signInForm" onsubmit="handleSignInSubmit(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address or Mobile Number</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="loginEmail" placeholder="e.g. user@rkfashions.com or 9876543210" required value="alex.vip@rkfashions.com">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="loginPassword">Password</label>
                        <a href="#" class="forgot-link" onclick="alert('Password reset link sent to your email!')">Forgot password?</a>
                    </div>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="loginPassword" placeholder="••••••••" required value="fashion2026">
                        <button type="button" class="btn-toggle-pw" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="rememberMe" checked>
                        <span class="checkmark"></span>
                        Keep me logged in
                    </label>
                </div>

                <button type="submit" class="btn-auth-submit">
                    LOG IN & OPEN STORE <span>→</span>
                </button>

                <!-- QUICK DEMO LOGIN BUTTON -->
                <div class="demo-login-box">
                    <button type="button" class="btn-demo-login" onclick="quickDemoLogin('RK VIP Member')">
                        ⚡ 1-Click Quick Demo Login
                    </button>
                </div>

                <div class="auth-divider">
                    <span>OR CONTINUE WITH</span>
                </div>

                <div class="social-login-grid">
                    <button type="button" class="btn-social" onclick="quickDemoLogin('Google User')">
                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="btn-social" onclick="quickDemoLogin('Apple VIP')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.8 1.44-.61.71-1.14 1.86-1 2.98 1.08.08 2.16-.57 2.81-1.38z"/>
                        </svg>
                        Apple
                    </button>
                </div>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signUpForm" onsubmit="handleSignUpSubmit(event)" style="display: none;">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="signupName" placeholder="e.g. Alex Morgan" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address or Mobile</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="signupEmail" placeholder="your.name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Create Password</label>
                    <div class="input-with-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">
                    CREATE ACCOUNT & OPEN STORE <span>→</span>
                </button>
            </form>

        </div>
    </main>

    <!-- SUCCESS TOAST OVERLAY -->
    <div class="auth-toast" id="authToast">
        <div class="toast-content">
            <span class="toast-icon">🎉</span>
            <div class="toast-text">
                <strong id="toastTitle">Login Successful!</strong>
                <p id="toastSub">Opening RK Fashions Store Home & Offer Banner...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(tab) {
            let signInForm = document.getElementById('signInForm');
            let signUpForm = document.getElementById('signUpForm');
            let tabSignIn = document.getElementById('tabSignIn');
            let tabSignUp = document.getElementById('tabSignUp');
            let tabSubtext = document.getElementById('tabSubtext');

            if (tab === 'signin') {
                signInForm.style.display = 'block';
                signUpForm.style.display = 'none';
                tabSignIn.classList.add('active');
                tabSignUp.classList.remove('active');
                tabSubtext.innerText = "Sign in to your RK Fashions account to open Store Home with your 40% offer.";
            } else {
                signInForm.style.display = 'none';
                signUpForm.style.display = 'block';
                tabSignIn.classList.remove('active');
                tabSignUp.classList.add('active');
                tabSubtext.innerText = "Create a new RK Fashions account to claim your 40% Welcome Bonus & Free Express Shipping.";
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            let input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }
    </script>
</body>
</html>
