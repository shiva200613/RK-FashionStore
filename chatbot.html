<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK FASHIONS - AI Stylist</title>
    <meta name="description" content="Chat with your personal AI Fashion Stylist">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .ai-page-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        #fullChatContainer {
            width: 100%;
            max-width: 800px;
            height: 75vh;
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-3d);
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <div class="logo">
            <a href="home.html">RK FASHIONS</a>
        </div>
        <nav>
            <a href="home.html">Home</a>
            <a href="home.html">Store</a>
            <a href="chatbot.html" class="active">AI Stylist</a>
        </nav>
        <div class="header-icons">
            <button class="icon-btn auth-btn" onclick="window.location.href='index.html'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Login</span>
            </button>
        </div>
    </header>

    <!-- ================= AI CHAT SECTION ================= -->
    <main class="ai-page-main">
        <div id="fullChatContainer">
            <!-- Chatbox gets injected here by script.js -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
